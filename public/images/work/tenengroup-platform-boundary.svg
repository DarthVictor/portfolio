<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title description">
  <title id="title">Simplified Tenengroup commerce-platform migration</title>
  <desc id="description">A diagram showing a legacy template-coupled storefront moving to a Next.js and React frontend behind an explicit .NET API boundary, with shared multi-brand delivery infrastructure.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#17243d"/>
      <stop offset="1" stop-color="#10192b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#030711" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12z" fill="#ff9a78"/>
    </marker>
  </defs>

  <rect width="1600" height="960" fill="#0d1424"/>
  <circle cx="1480" cy="84" r="260" fill="#1d334f" opacity=".42"/>
  <circle cx="86" cy="920" r="280" fill="#3b241d" opacity=".54"/>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#ffb59f">
    <text x="112" y="108" font-size="22" font-weight="700" letter-spacing="4">TENENGROUP · PLATFORM MIGRATION</text>
    <text x="112" y="160" font-size="42" font-family="system-ui, sans-serif" font-weight="700" letter-spacing="-1">From template coupling to explicit product boundaries</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="112" y="244" width="402" height="448" rx="28" fill="url(#surface)" stroke="#42536d" stroke-width="2"/>
    <rect x="598" y="244" width="402" height="448" rx="28" fill="url(#surface)" stroke="#ff9a78" stroke-width="2"/>
    <rect x="1084" y="244" width="404" height="448" rx="28" fill="url(#surface)" stroke="#42536d" stroke-width="2"/>
  </g>

  <g font-family="system-ui, sans-serif">
    <text x="156" y="306" fill="#aab3c4" font-size="19" font-weight="700" letter-spacing="2">BEFORE</text>
    <text x="156" y="356" fill="#f2f4f8" font-size="32" font-weight="700">Template-coupled storefront</text>
    <rect x="156" y="400" width="314" height="74" rx="14" fill="#202e46"/>
    <text x="180" y="445" fill="#f2f4f8" font-size="24" font-weight="600">.NET-rendered templates</text>
    <rect x="156" y="490" width="314" height="74" rx="14" fill="#202e46"/>
    <text x="180" y="535" fill="#f2f4f8" font-size="24" font-weight="600">React and Redux widgets</text>
    <rect x="156" y="580" width="314" height="74" rx="14" fill="#202e46"/>
    <text x="180" y="625" fill="#f2f4f8" font-size="24" font-weight="600">Central state payload</text>

    <text x="642" y="306" fill="#ffb59f" font-size="19" font-weight="700" letter-spacing="2">THE BOUNDARY</text>
    <text x="642" y="356" fill="#f2f4f8" font-size="32" font-weight="700">Deliberate API contract</text>
    <rect x="642" y="400" width="314" height="112" rx="14" fill="#3b241d" stroke="#ff9a78" stroke-width="2"/>
    <text x="666" y="445" fill="#f2f4f8" font-size="24" font-weight="700">Modern .NET API</text>
    <text x="666" y="482" fill="#ffcfbf" font-size="20">Explicit data contracts</text>
    <rect x="642" y="530" width="314" height="124" rx="14" fill="#202e46"/>
    <text x="666" y="575" fill="#f2f4f8" font-size="24" font-weight="700">Clear state ownership</text>
    <text x="666" y="612" fill="#aab3c4" font-size="20">SWR: server state · Zustand: UI state</text>

    <text x="1128" y="306" fill="#aab3c4" font-size="19" font-weight="700" letter-spacing="2">AFTER</text>
    <text x="1128" y="356" fill="#f2f4f8" font-size="32" font-weight="700">Shared frontend foundation</text>
    <rect x="1128" y="400" width="316" height="78" rx="14" fill="#202e46"/>
    <text x="1152" y="448" fill="#f2f4f8" font-size="24" font-weight="600">Next.js + React application</text>
    <text x="1128" y="535" fill="#aab3c4" font-size="19" font-weight="700" letter-spacing="2">BRAND VARIATION</text>
    <rect x="1128" y="560" width="94" height="44" rx="22" fill="#2a3d59"/>
    <rect x="1236" y="560" width="132" height="44" rx="22" fill="#2a3d59"/>
    <rect x="1382" y="560" width="62" height="44" rx="22" fill="#2a3d59"/>
    <text x="1151" y="588" fill="#f2f4f8" font-size="17" font-weight="700">MYKA</text>
    <text x="1256" y="588" fill="#f2f4f8" font-size="17" font-weight="700">OAK &amp; LUNA</text>
    <text x="1399" y="588" fill="#f2f4f8" font-size="17" font-weight="700">…</text>
    <text x="1128" y="650" fill="#aab3c4" font-size="20">Shared data access, localisation,</text>
    <text x="1128" y="680" fill="#aab3c4" font-size="20">and product capabilities</text>
  </g>

  <path d="M526 468 H578" stroke="#ff9a78" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1012 468 H1064" stroke="#ff9a78" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="112" y="754" width="1376" height="112" rx="24" fill="#17243d" stroke="#42536d" stroke-width="2"/>
  </g>
  <g font-family="system-ui, sans-serif">
    <text x="156" y="802" fill="#ffb59f" font-size="18" font-weight="700" letter-spacing="2">DELIVERY FOUNDATION</text>
    <text x="156" y="842" fill="#f2f4f8" font-size="27" font-weight="600">Managed Kubernetes in AWS · Terraform-defined infrastructure · reproducible deployments</text>
  </g>
</svg>
